name: Python checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m kvsr doctor
      - run: python -m kvsr evaluate --references examples/synthetic_references.jsonl --predictions examples/synthetic_predictions.jsonl --output results/synthetic.json

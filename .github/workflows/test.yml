name: Python checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m kvsr doctor
      - run: python -m kvsr evaluate --references examples/synthetic_references.jsonl --predictions examples/synthetic_predictions.jsonl --output results/synthetic.json
  video-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.5.3 opencv-contrib-python==5.0.0.93 imageio-ffmpeg==0.6.0
      - run: python -m unittest discover -s tests -v

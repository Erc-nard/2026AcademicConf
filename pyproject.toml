[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "korean-vsr-context"
version = "0.1.0"
description = "Reproducible data preparation and evaluation for Korean VSR"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
kvsr = "kvsr.__main__:main"

[tool.setuptools.packages.find]
include = ["kvsr*"]

